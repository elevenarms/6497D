# Deploys the site to GitHub Pages. Google Analytics is added only to the deployed copy,
# from the GA_MEASUREMENT_ID repository secret, so the tag never lives in the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage site
        run: rsync -a --exclude .git --exclude .github ./ _site/

      - name: Add Google Analytics
        env:
          GA_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          ga = os.environ.get("GA_ID", "").strip()
          if not ga:
              print("GA_MEASUREMENT_ID not set; deploying without analytics")
              raise SystemExit(0)
          if not re.fullmatch(r"G-[A-Z0-9]{4,20}", ga):
              raise SystemExit("GA_MEASUREMENT_ID does not look like a GA4 measurement ID (G-XXXXXXX)")
          tag = (f'<script async src="https://www.googletagmanager.com/gtag/js?id={ga}"></script>\n'
                 "<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}"
                 f"gtag('js',new Date());gtag('config','{ga}');</script>\n")
          n = 0
          for page in pathlib.Path("_site").rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              if "googletagmanager.com/gtag" in html or "</head>" not in html:
                  continue
              page.write_text(html.replace("</head>", tag + "</head>", 1), encoding="utf-8")
              n += 1
          print(f"Analytics added to {n} page(s)")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
